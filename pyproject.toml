[project]
name = "metal"
version = "0.1.0"
description = "Интернет-магазин металлопроката: FastAPI + PostgreSQL, SEO-каталог"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
