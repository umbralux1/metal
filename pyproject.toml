[project]
name = "metal"
version = "0.1.0"
description = "Интернет-магазин металлопроката: FastAPI + PostgreSQL, SEO-каталог"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Правила зафиксированы явно: новые версии ruff включают больше правил по умолчанию, и без списка
# make check начинает падать после обновления ruff, хотя код не менялся.
# E4/E7/E9/F — ошибки и неиспользуемое, I — порядок импортов, S — опасные конструкции (flake8-bandit):
# SQL в f-строках, пароли в коде, eval, pickle, verify=False. Ложное срабатывание — # noqa: Sxxx с причиной.
select = ["E4", "E7", "E9", "F", "I", "S"]

[tool.ruff.lint.isort]
# Свои пакеты — явно: иначе импорт ещё не созданного модуля (тесты до кода, TDD) ruff считает сторонним
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# В тестах assert — основной инструмент, тестовые пароли и разбор своего sitemap безопасны
"tests/**" = ["S101", "S104", "S105", "S106", "S314"]

# Контракты зависимостей модулей (CLAUDE.md, «Архитектура»): make check → lint-imports.
# ignore_imports — уже существующие нарушения, каждое записано в docs/tech-debt.md. Новых не добавлять.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Слои: страницы → корзина → заявки → каталог → SEO → ядро"
type = "layers"
layers = ["app.main", "app.admin | app.pages", "app.cart", "app.leads", "app.catalog", "app.seo", "app.core"]
ignore_imports = [
    "app.core.startup -> app.catalog.*",  # запуск сервера: сид и посадочные — место им в app.main
    "app.core.startup -> app.delivery.*",
    "app.core.nav -> app.catalog.models",  # меню каталога лежит в core
    "app.core.templating -> app.catalog.drawings",  # SVG-чертежи как глобальные функции шаблонов
    "app.core.templating -> app.cart.store",  # счётчик корзины в шапке
]

[[tool.importlinter.contracts]]
name = "Доставка не знает про корзину, товары и заявки"
type = "forbidden"
source_modules = ["app.delivery"]
forbidden_modules = ["app.catalog", "app.cart", "app.leads", "app.seo", "app.pages", "app.admin"]

[[tool.importlinter.contracts]]
name = "Таблицы доставки — только самой доставке и админке"
type = "forbidden"
source_modules = ["app.cart", "app.leads", "app.catalog", "app.pages", "app.seo"]
forbidden_modules = ["app.delivery.models"]
allow_indirect_imports = true  # через app.delivery.service — можно, напрямую — нет

[[tool.importlinter.contracts]]
name = "Заявки снаружи — только через app.leads.service и чистые модули"
type = "forbidden"
source_modules = ["app.cart", "app.catalog", "app.pages", "app.seo", "app.delivery", "app.core"]
forbidden_modules = ["app.leads.models", "app.leads.router", "app.leads.notify"]
allow_indirect_imports = true  # через app.leads.service — можно, напрямую — нет

[[tool.importlinter.contracts]]
name = "Чистые функции: без базы, сети и веба"
type = "forbidden"
source_modules = [
    "app.seo.hours",
    "app.catalog.utils",
    "app.catalog.landing_rules",
    "app.delivery.pricing",
    "app.delivery.cargo",
    "app.delivery.selection",
    "app.leads.phone",
]
forbidden_modules = ["sqlalchemy", "httpx", "fastapi", "starlette", "app.core.db", "app.core.config"]

# Типы: mypy в make check, весь app без исключений. Строго — app.delivery и app.cart, остальное — базовая проверка.
[tool.mypy]
python_version = "3.11"
files = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["app.delivery.*", "app.cart.*"]
# strict = true в overrides mypy не поддерживает — его флаги для модуля по отдельности
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["wtforms", "wtforms.*"]
ignore_missing_imports = true
