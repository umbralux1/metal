[project]
name = "metal"
version = "0.1.0"
description = "Интернет-магазин металлопроката: FastAPI + PostgreSQL, SEO-каталог"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Правила зафиксированы явно: новые версии ruff включают больше правил по умолчанию, и без списка
# make check начинает падать после обновления ruff, хотя код не менялся.
# E4/E7/E9/F — ошибки и неиспользуемое, I — порядок импортов.
select = ["E4", "E7", "E9", "F", "I"]
