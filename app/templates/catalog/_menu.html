{# Вертикальный список разделов. items — разделы с name, url, slug; has_children — показывать ли стрелку. #}
<ul class="cat-menu">
  {% for c in items %}
  <li>
    <a href="{{ c.url }}"{% if request.url.path.startswith(c.url) %} aria-current="page"{% endif %}>
      {{ category_icon(c.url.split('/')[2]) }}
      <span>{{ c.name }}</span>
      {% if c.has_children is not defined or c.has_children %}
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6l6 6-6 6"/></svg>
      {% endif %}
    </a>
  </li>
  {% endfor %}
</ul>
