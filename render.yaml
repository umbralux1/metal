# Render Blueprint: веб-сервис FastAPI + PostgreSQL.
# Render → New → Blueprint → выбрать репозиторий → Apply.
# Документация: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: metal-web
    runtime: python
    plan: free                      # для продакшена: 0.5c-512mb или выше (не засыпает)
    region: frankfurt               # ближайший к России регион Render
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/render-start.sh   # миграции + uvicorn
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: metal-db
          property: connectionString
      # Остальные настройки тестового окружения — в deploy/render.env (приложение читает его само).
      # Значения, заданные здесь или в панели Render, важнее файла.

databases:
  - name: metal-db
    plan: free                      # бесплатная база удаляется через 30 дней — для продакшена 0.1c-256mb и выше
    region: frankfurt
    databaseName: metal
    user: metal
    postgresMajorVersion: "16"
