# Render Blueprint: веб-сервис FastAPI + PostgreSQL.
# Render → New → Blueprint → выбрать репозиторий → Apply.
# Документация: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: metal-web
    runtime: python
    plan: free                      # для продакшена: 0.5c-512mb или выше (не засыпает)
    region: frankfurt               # ближайший к России регион Render
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/render-start.sh   # миграции + uvicorn
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: metal-db
          property: connectionString
      # Пока сайт живёт на *.onrender.com, закрываем его от поисковиков,
      # чтобы копия не попала в индекс раньше основного домена.
      # После подключения домена: ALLOW_INDEXING=true и SITE_URL=https://ваш-домен.ru
      - key: ALLOW_INDEXING
        value: "false"
      - key: SEED_DEMO
        value: "true"               # демо-товары при первом запуске; выключите, когда загрузите прайс
      # Админка /admin: пароль и ключ сессий Render сгенерирует сам — пароль смотрите в Environment
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      # Временные данные для MVP — замените на настоящие
      - key: SITE_NAME
        value: Металлобаза
      - key: PHONE
        value: "+7 (495) 000-00-00"
      - key: EMAIL
        value: info@example.ru
      - key: WORK_HOURS
        value: "Пн–Сб 9:00–19:00, Вс 10:00–15:00"
      - key: ADDRESS
        value: "Москва, склад (адрес уточняется)"
      - key: CUT_PRICE_KOP
        value: "5000"
      - key: TON_PRICE_FROM_KG
        value: "1000"

databases:
  - name: metal-db
    plan: free                      # бесплатная база удаляется через 30 дней — для продакшена 0.1c-256mb и выше
    region: frankfurt
    databaseName: metal
    user: metal
    postgresMajorVersion: "16"
